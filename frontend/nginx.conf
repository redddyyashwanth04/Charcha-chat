server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering off;          # required so streamed replies arrive token by token
    proxy_read_timeout 300s;
  }
  location / {
    try_files $uri /index.html;   # single-page app routing (/c/123 on refresh)
  }
}
