# One command: docker compose up --build   ->   http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doubtchat
      POSTGRES_PASSWORD: doubtchat
      POSTGRES_DB: doubtchat
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doubtchat"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://doubtchat:doubtchat@db:5432/doubtchat
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
